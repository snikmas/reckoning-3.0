<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reckoning Stage 2 — Simulated Web Continuity Prototype</title>
<style>
:root{
  --bg:#080d0a; --panel:#0d1410; --panel-2:#111a15; --panel-3:#0a100d;
  --border:#1f2e26; --border-strong:#2f4a3a;
  --text:#d6e3da; --muted:#93a89b; --dim:#63776b;
  --green:#57d38c; --green-dim:#2f7d55; --green-bg:#0f2018;
  --amber:#e0a94b; --amber-bg:#221a0d;
  --gray:#6b7d74; --red:#e06c6c; --red-bg:#241013;
  --rail-w:212px; --inspector-w:380px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans Cyrillic", "PingFang SC", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:var(--mono);letter-spacing:.02em}
.btn:hover{border-color:var(--green-dim);background:#16241c}
.btn--primary{border-color:var(--green-dim);background:var(--green-bg);color:#c8f2d8}
.btn--ghost{background:transparent}
.btn--amber{border-color:#6b5322;background:var(--amber-bg);color:#f0d19a}
.btn--tiny{padding:4px 8px;font-size:12px}
.btn.is-on{background:var(--green-bg);border-color:var(--green);color:#d8f7e5}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid}
.chip-icon{font-size:11px;line-height:1}
.chip--green{color:#a9ecc5;border-color:#2f6b49;background:var(--green-bg)}
.chip--amber{color:#f0cf94;border-color:#6b5322;background:var(--amber-bg)}
.chip--gray{color:#b3c1b9;border-color:#33443b;background:#141d18}
.chip--red{color:#f3b3b3;border-color:#6e2f2f;background:var(--red-bg)}
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;min-height:0}
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.brand-mark{color:var(--green)}
.sim-notice{flex:1;margin:0;font-family:var(--mono);font-size:11px;color:#f0cf94;display:flex;align-items:center;gap:6px;min-width:220px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.simon-state{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--gray)}
.dot-green{background:var(--green)} .dot-amber{background:var(--amber)} .dot-red{background:var(--red)} .dot-gray{background:var(--gray)}
.rail{grid-column:1;grid-row:2/4;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;padding:10px 8px;gap:4px;min-height:0;overflow-y:auto}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 10px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.rail-item:hover{color:var(--text);background:#121b16}
.rail-item.is-active{color:#d8f7e5;border-color:var(--green-dim);background:var(--green-bg)}
.rail-icon{display:inline-flex;width:16px;height:16px}
.stage{grid-column:2;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) var(--inspector-w);min-height:0}
.workspace{min-height:0;overflow-y:auto;padding:22px 24px 40px}
.inspector{min-height:0;overflow-y:auto;border-left:1px solid var(--border);background:var(--panel);padding:16px}
.composer{grid-column:2;grid-row:3;border-top:1px solid var(--border);background:var(--panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:40px;max-height:120px;background:var(--panel-3);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
.composer-note{margin:6px 0 0;font-family:var(--mono);font-size:11px;color:var(--dim)}
.drawer{position:fixed;top:64px;right:14px;z-index:80;width:min(92vw,470px);max-height:min(78dvh,660px);overflow:auto;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:10px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.drawer[hidden]{display:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.scene-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.scene-btn{text-align:left;background:var(--panel-3);border:1px solid var(--border);border-radius:6px;padding:9px;color:var(--text);cursor:pointer;font-size:13px}
.scene-btn:hover{border-color:var(--green-dim)}
.scene-btn.is-active{border-color:var(--green);background:var(--green-bg)}
.state-json{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;color:#bcd0c3;background:var(--panel-3);border:1px solid var(--border);border-radius:6px;padding:10px;margin:0}
.view{max-width:1080px}
.view-head h1{font-size:20px;margin:0 0 2px;letter-spacing:.02em}
.view-sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.panel-title{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;background:var(--panel-3)}
.card-top{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.card h3{margin:2px 0 6px;font-size:15px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--dim);border:1px dashed var(--border);border-radius:6px;padding:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.list-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--panel-3);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;color:var(--text);align-items:center}
.list-item.is-active{border-color:var(--green-dim);background:var(--green-bg)}
.view--conversation{max-width:920px}
.sim-banner{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:18px}
.simon-avatar{flex:0 0 auto;animation:breathe 4s ease-in-out infinite}
.simon-avatar .eye{animation:blink 6s steps(1) infinite}
@keyframes breathe{0%,100%{opacity:.86}50%{opacity:1}}
@keyframes blink{0%,95%,100%{opacity:1}96%,98%{opacity:.25}}
.transcript{display:flex;flex-direction:column;gap:14px}
.msg{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--panel)}
.msg--user{background:#0c1310;border-color:#1b2a22}
.msg--assistant{border-color:#22392d}
.msg.is-selected{border-color:var(--green);box-shadow:0 0 0 1px var(--green-dim) inset}
.msg--failed{border-color:#5c2a2a}
.msg-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.msg-role{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#a9ecc5}
.msg--user .msg-role{color:#b3c1b9}
.msg-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.6}
.msg-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feedback-line{font-size:12px;margin:8px 0 0}
.proposal{border:1px solid var(--green-dim);border-radius:8px;padding:14px;background:linear-gradient(180deg,#0f1c15,#0c1410);margin:4px 0 10px}
.proposal.is-selected{border-color:var(--green);box-shadow:0 0 0 1px var(--green-dim) inset}
.proposal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.proposal h3{margin:4px 0 8px;font-size:16px}
.proposal-decision{font-size:15px;margin:0 0 8px}
.proposal-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.proposal-facts ul{margin:6px 0 0;padding-left:18px}
.uncertainty li{color:#f0cf94}
.change-note{font-size:13px;color:#f0cf94;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proposal-foot{margin:10px 0 0;font-size:11px}
.failure{border:1px solid #6e2f2f;border-radius:8px;padding:14px;background:var(--red-bg)}
.failure-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kv dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14px}
.feedback-form{margin-top:12px;border:1px solid var(--border-strong);border-radius:8px;padding:12px;background:var(--panel-2)}
.rate{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.rate-btns{display:flex;gap:6px}
.feedback-form textarea{width:100%;margin:6px 0 4px;background:var(--panel-3);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;margin:6px 0}
.inspector-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.inspector-body h2,.inspector-title{font-size:16px;margin:0 0 8px}
.inspector-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.inspector-body h3{margin:16px 0 6px}
.inspector-body ul{padding-left:18px;margin:6px 0}
.inspector-body p{margin:4px 0}
.evidence{list-style:none;padding:0;margin:0}
.evidence li{border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--panel-3)}
.evidence .quote{margin:6px 0;font-style:italic;overflow-wrap:anywhere}
.history{list-style:none;padding:0;margin:0}
.history li{padding:4px 0;border-bottom:1px solid var(--border)}
.annotation{display:block;font-size:11px;color:var(--dim);font-family:var(--mono)}
.reasons{list-style:none;padding:0}
.reasons li{border-left:2px solid var(--border-strong);padding:4px 0 4px 10px;margin-bottom:8px}
.mini{border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--panel-3)}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .topbar{grid-column:1;grid-row:1}
  .rail{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--border);padding:6px 8px}
  .rail-item{width:auto;flex:0 0 auto;white-space:nowrap}
  .stage{grid-column:1;grid-row:3;grid-template-columns:minmax(0,1fr)}
  .inspector{position:fixed;inset:0;z-index:70;border-left:0;display:none;padding-top:16px}
  .inspector.open{display:block}
  .composer{grid-column:1;grid-row:4}
  .grid-2{grid-template-columns:1fr}
  .proposal-facts{grid-template-columns:1fr}
  .scene-list{grid-template-columns:1fr}
  .workspace{padding:16px 14px 28px}
  .sim-notice{order:3;flex-basis:100%}
}
@media (min-width:881px){ .inspector-close{display:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
.reduced-motion *, .reduced-motion *::before, .reduced-motion *::after{animation:none !important;transition:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">&#9670;</span><span>RECKONING / STAGE&nbsp;2 PROTOTYPE</span></div>
    <p class="sim-notice" role="note"><span aria-hidden="true">&#9650;</span><span>SIMULATED PROTOTYPE &mdash; no model is called, no network request is made, and no data is saved.</span></p>
    <div class="topbar-right">
      <button id="toggle-scenes" class="btn btn--ghost" data-action="toggle-scenes" aria-expanded="false" aria-controls="scenes-panel">Scenes</button>
      <button id="toggle-state" class="btn btn--ghost" data-action="toggle-state" aria-expanded="false" aria-controls="state-panel">State</button>
      <span class="simon-state" id="simon-state"><span class="dot" aria-hidden="true"></span><span id="simon-state-label">SIMON: READY</span></span>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Primary"></nav>
  <div class="stage">
    <main class="workspace" id="workspace" tabindex="-1"></main>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="composer" id="composer">
    <form id="composer-form" autocomplete="off">
      <label class="sr-only" for="composer-input">Message Simon</label>
      <textarea id="composer-input" rows="1" placeholder="Record something, ask Simon, or resume a decision&hellip;"></textarea>
      <button id="composer-send" class="btn btn--primary" type="submit">Send</button>
    </form>
    <p class="composer-note" id="live" role="status" aria-live="polite"></p>
  </div>
  <div class="drawer" id="scenes-panel" hidden></div>
  <div class="drawer" id="state-panel" hidden></div>
</div>
<noscript><p style="padding:16px;color:#f0cf94">This prototype requires JavaScript. It is a simulated review artifact and calls no model.</p></noscript>
<script>
(function(){
  'use strict';

  var state = baseState();

  function baseState(){
    return {
      screen:'simon', scenario:'empty', profile:null, simonState:'ready',
      messages:[], proposals:[], decisions:[], checkins:[],
      selected:null, feedback:{}, failure:null, feedbackForm:null,
      inspectorOpen:false, inspectorOpenerId:null,
      scenesOpen:false, stateOpen:false, reducedMotion:false, rejected:null,
      lastAction:'Empty first conversation loaded.'
    };
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function chip(kind, label){
    var glyph = {green:'\u2713', amber:'!', gray:'\u2013', red:'\u2715'}[kind] || '\u2013';
    return '<span class="chip chip--'+kind+'"><span class="chip-icon" aria-hidden="true">'+glyph+'</span>'+esc(label)+'</span>';
  }
  function nowTime(){
    var d = new Date();
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  function nowStamp(){
    var d = new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+nowTime();
  }
  var uid = 0;
  function nid(prefix){ uid++; return prefix+'_n'+uid.toString(36); }
  function isNarrow(){ return window.matchMedia('(max-width: 880px)').matches; }
  function byId(id){ return document.getElementById(id); }

  var ICONS = {
    home:'<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 7.5 8 3l5.5 4.5"/><path d="M4 7v6h8V7"/></svg>',
    chat:'<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>',
    plan:'<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="10"/><path d="M2.5 6.5h11M5.5 2.5v2M10.5 2.5v2"/></svg>',
    review:'<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3.5h10v9H3z"/><path d="M5.5 8l1.5 1.5 3-3"/></svg>',
    control:'<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5h10M3 11h10"/><circle cx="6" cy="5" r="1.4"/><circle cx="10" cy="11" r="1.4"/></svg>'
  };
  function icon(n){ return ICONS[n] || ICONS.home; }
  function stateLabel(st){ return {ready:'Ready', reasoning:'Reasoning', limited:'Limited', failed:'Failed'}[st] || 'Ready'; }
  function simonAvatar(st){
    var eye = st==='failed' ? '#e06c6c' : (st==='limited'||st==='reasoning') ? '#e0a94b' : '#57d38c';
    return '<svg class="simon-avatar" viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="Simon, an original prototype avatar, simulated state '+stateLabel(st)+'">'+
      '<rect x="9" y="16" width="46" height="34" rx="9" fill="#0c1410" stroke="#2f4a3a"/>'+
      '<rect x="13" y="20" width="38" height="26" rx="6" fill="#0a100d"/>'+
      '<rect x="20" y="29" width="24" height="8" rx="2" fill="#0f1a14"/>'+
      '<rect class="eye" x="23" y="31" width="8" height="4" fill="'+eye+'"/>'+
      '<rect x="35" y="31" width="6" height="4" fill="#2f7d55"/>'+
      '<rect x="30" y="7" width="3" height="9" fill="#2f4a3a"/>'+
      '<rect x="27" y="4" width="9" height="4" fill="'+eye+'"/>'+
      '<rect x="15" y="42" width="34" height="2" fill="#223229"/>'+
      '<rect x="15" y="45" width="20" height="2" fill="#1a2a22"/>'+
    '</svg>';
  }

  function m(id, role, text, extra){
    var o = {id:id, role:role, text:text, time:nowTime()};
    if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra,k)) o[k]=extra[k]; } }
    return o;
  }

  function evidenceV1(){
    return [
      {kind:'user', source:'Your message \u00b7 2026-09-13', quote:'\u201cI start at 100 words and quit by Wednesday.\u201d'},
      {kind:'user', source:'Your message \u00b7 2026-08-30', quote:'\u201cThe week I did 20 a day I actually finished.\u201d'},
      {kind:'model', source:'Simon inference \u00b7 unconfirmed', quote:'A small fixed daily load survived; a large variable load did not.'},
      {kind:'user', source:'Your message \u00b7 2026-09-13', quote:'\u201cAbout ten minutes a day, no more.\u201d'}
    ];
  }
  function proposalV1(){
    return {
      id:'prop_4c7e', introducedBy:'r_12', version:1, status:'proposed',
      title:'Study method: small fixed load with spaced repetition',
      situation:'You are preparing for a Level 4 Mandarin reading exam in about 14 weeks. Two attempts at 100 new words a day collapsed by Wednesday. A week at 20 a day finished.',
      decision:'Use 20 new spaced-repetition cards a day plus 15 minutes of graded reading, and review only what is due.',
      reasons:[
        'Your own reports show a small, fixed daily load is the pattern that survived past week one.',
        'Spaced repetition matches the retention goal better than re-reading word lists.',
        'Graded reading gives context for words that look familiar but are not yet usable.'
      ],
      tradeoffs:[
        'Slower coverage than 100 words a day, so the trial must start soon to be useful before the exam.',
        'Requires a short daily session instead of one long weekend session.'
      ],
      uncertainty:[
        'No measured baseline for your current vocabulary; the first two weeks are a trial, not a prediction.',
        'The 14-week deadline is your estimate; no official requirement has been checked in this prototype.'
      ],
      nextAction:'Run a two-week trial at 20 cards a day, then review at day 14 and adjust.',
      evidence:evidenceV1(),
      history:[{version:1, date:'2026-09-13', note:'Proposed'}]
    };
  }
  function proposalV2(){
    var p = proposalV1();
    p.version = 2; p.status = 'proposed'; p.introducedBy = 'r_13';
    p.decision = 'Use 30 new spaced-repetition cards a day plus 10 minutes of graded reading, and review only what is due.';
    p.changeNote = 'Changed the daily new-card load from 20 to 30 and the reading block from 15 to 10 minutes, at your request.';
    p.history = [
      {version:1, date:'2026-09-13', note:'Proposed'},
      {version:2, date:'2026-09-13', note:'Revised after your correction'}
    ];
    p.supersededVersion = 1;
    return p;
  }
  function decisionFromV2(){
    return {
      id:'dec_9f21', proposalId:'prop_4c7e', version:2, status:'confirmed',
      title:'Study method: small fixed load with spaced repetition',
      confirmedAt:'2026-09-13 14:26',
      reasons:[
        {text:'A small, fixed daily load is the pattern that survived past week one.', recordedAt:'2026-09-13', annotation:'Recorded at confirmation. Historical reason, not current advice.'},

  function statusChipForProposal(p){
    if(p.status==='proposed') return chip('amber','Proposed \u2014 not confirmed');
    if(p.status==='confirmed') return chip('green','Confirmed');
    if(p.status==='dismissed') return chip('gray','Dismissed \u2014 not deleted');
    if(p.status==='superseded') return chip('gray','Superseded');
    return chip('gray', p.status);
  }

  function selectItem(type, id){

      state.inspectorOpen = true;
      state.inspectorOpenerId = (document.activeElement && document.activeElement.id) || null;
    }
    render();

      else { var panel = byId('inspector'); if(panel){ panel.setAttribute('tabindex','-1'); panel.focus(); } }

  function confirmProposal(id){
    var p = null, i;
    for(i=0;i<state.proposals.length;i++){ if(state.proposals[i].id===id){ p=state.proposals[i]; break; } }
    if(!p || p.status!=='proposed'){ state.lastAction='Nothing confirmed: no open proposal for '+id+'.'; render(); return; }
    p.status = 'confirmed';
    var did = p.id==='prop_4c7e' ? 'dec_9f21' : nid('dec');
    var d = {id:did, proposalId:p.id, version:p.version, status:'confirmed', title:p.title, confirmedAt:nowStamp(),
      reasons:p.reasons.map(function(r){ return {text:r, recordedAt:'2026-09-13', annotation:'Recorded at confirmation. Historical reason, not current advice.'}; }),
      currentContext:'Confirmed version '+p.version+'. No outcome has been recorded yet.'};
    state.decisions.push(d);
    state.selected = {type:'decision', id:did};
    state.messages.push(m(nid('r'),'assistant','Confirmed version '+p.version+' of '+p.title+'. The record is '+did+'. You can find it in Review and on Home. Application code checked the version at confirmation.'));
    state.lastAction = 'Confirmed '+p.id+' version '+p.version+' \u2192 '+did+'.';
    render();
  }
  function attemptStale(id){
    var p = null, i;
    for(i=0;i<state.proposals.length;i++){ if(state.proposals[i].id===id){ p=state.proposals[i]; break; } }
    if(!p){ state.lastAction='Stale check skipped: proposal not found.'; render(); return; }
    if(p.version<2){ state.lastAction='This proposal has only version 1; nothing is stale yet.'; render(); return; }
    state.rejected = {proposalId:p.id, attemptedVersion:1, currentVersion:p.version, at:nowStamp(), reason:'Version 1 was superseded by version '+p.version+'.'};
    state.messages.push(m(nid('r'),'assistant','Not confirmed. That control targeted version 1, but '+p.id+' is now version '+p.version+'. I will not confirm a version you are not currently reading. Review version '+p.version+' and confirm it explicitly.'));
    state.lastAction = 'Stale confirmation rejected: attempted version 1, current version '+p.version+'. Nothing confirmed.';
    render();
  }
  function correctProposal(id){
    var i = -1, k;
    for(k=0;k<state.proposals.length;k++){ if(state.proposals[k].id===id){ i=k; break; } }
    if(i<0) return;
    if(state.proposals[i].version>=2){ state.lastAction='Already at version '+state.proposals[i].version+'; no further scripted correction.'; render(); return; }
    var v2 = proposalV2();
    v2.introducedBy = nid('r');

    state.selected = {type:'proposal', id:v2.id};
    state.messages.push(m(v2.introducedBy,'assistant','Updated. Version 2 changes the daily load from 20 to 30 cards and the reading block from 15 to 10 minutes. The earlier version stays inspectable.'));
    state.lastAction = 'Correction applied: '+v2.id+' revised to version 2. Not confirmed.';

  function handleSend(text){
    text = String(text||'').trim();
    if(!text){ return; }
    var userMsg = m(nid('r'), 'user', text);
    state.messages.push(userMsg);
    state.screen = 'simon';
    state.selected = {type:'message', id:userMsg.id};
    var lower = text.toLowerCase().replace(/[\s.!?\u3002\uff01\uff1f]+$/,'');
    var ambiguous = ['yes','yep','yeah','sure','ok','okay','fine','\u0434\u0430','\u0430\u0433\u0430','\u0445\u043e\u0440\u043e\u0448\u043e','\u597d','\u55ef','\u662f\u7684','\u5bf9'];
    var openProposal = null, i;
    for(i=0;i<state.proposals.length;i++){ if(state.proposals[i].status==='proposed'){ openProposal=state.proposals[i]; break; } }
    var reply;
    if(ambiguous.indexOf(lower)>=0){
      reply = m(nid('r'),'assistant','I want to be sure which proposal you mean before I save anything. Do you mean the current proposal'+(openProposal?', version '+openProposal.version+',':'')+' or something else? Use the Confirm control or name the version.');
      state.lastAction = 'Ambiguous assent: clarification requested, nothing confirmed.';
    } else if(openProposal && /confirm|version\s*\d/i.test(text)){
      reply = m(nid('r'),'assistant','To confirm, use the Confirm control on the exact version you are reading. This keeps the version binding explicit.');
      state.lastAction = 'Prompted to use the version-bound confirm control.';
    } else {
      reply = m(nid('r'),'assistant','Simulated reply. This prototype calls no model, so there is no real language response here. In production Simon would answer from confirmed context.');
      state.lastAction = 'Simulated reply appended; no model called and nothing saved.';
    }
    state.messages.push(reply);
    render();
  }

  function simonView(){
    var rendered = {};
    var html = ''+
    '<div class="view view--conversation">'+
      '<div class="view-head"><h1>Simon</h1><p class="view-sub">Your reasoning partner. Interpretation stays separate from confirmed records.</p></div>'+
      '<div class="sim-banner">'+simonAvatar(state.simonState)+
        '<div><div class="mono label">SIMON \u00b7 '+stateLabel(state.simonState)+'</div><p class="muted">Static prototype representation. In production, visual state follows real application state.</p></div>'+
      '</div>'+
      '<div class="transcript">';
    if(!state.messages.length){
      html += '<p class="empty">No messages yet. Type below to start. Nothing is saved.</p>';
    }
    state.messages.forEach(function(msg){
      html += messageView(msg);
      state.proposals.filter(function(p){ return p.introducedBy===msg.id; }).forEach(function(p){ html += proposalCard(p); rendered[p.id]=true; });
      if(msg.state==='failed' && state.failure){ html += failurePanel(); }
    });
    state.proposals.filter(function(p){ return !rendered[p.id]; }).forEach(function(p){ html += proposalCard(p); });
    html += '</div></div>';
    return html;
  }

        ['yes','partly','no'].map(function(v){

    return ''+
    '<h2 class="inspector-title">'+(msg.role==='user'?'Your message':'Simon reply')+'</h2>'+
    '<div class="inspector-meta">'+(msg.role==='assistant'?chip('gray','Assistant reply'):chip('gray','User statement'))+'<span class="mono dim">'+esc(id)+'</span></div>'+
    '<h3 class="mono label">TEXT</h3><p>'+esc(msg.text)+'</p>'+
    '<h3 class="mono label">LINKED RUN</h3><dl class="kv">'+

      '<div><dt>Provider / model</dt><dd>None</dd></div>'+

    '<div class="actions"><button id="fb-ins-'+esc(id)+'" class="btn btn--tiny" data-action="feedback-open" data-reply-id="'+esc(id)+'">Add feedback</button></div>';
  }

  function renderInspector(){
    var el = byId('inspector');
    var s = state.selected;
    var body;
    if(!s){ body = '<p class="empty">Select a reply, proposal, decision, or check-in to inspect it. The Inspector shows evidence, sources, versions, and actions for the current selection.</p>'; }
    else if(s.type==='message'){ body = inspectorMessage(s.id); }
    else if(s.type==='proposal'){ body = inspectorProposal(s.id); }
    else if(s.type==='decision'){ body = inspectorDecision(s.id); }
    else if(s.type==='checkin'){ body = inspectorCheckin(s.id); }
    else { body = '<p class="empty">Unknown selection.</p>'; }
    el.innerHTML = '<div class="inspector-head"><span class="mono label">INSPECTOR</span><button id="close-inspector" class="btn btn--tiny inspector-close" data-action="close-inspector">Close</button></div><div class="inspector-body">'+body+'</div>';
    if(state.inspectorOpen && isNarrow()){ el.classList.add('open'); } else { el.classList.remove('open'); }
  }

  function renderComposer(){
    var live = byId('live');
    if(live){ live.textContent = state.lastAction || 'Simulated reply. No model is called and nothing is saved.'; }
  }

  function renderScenesPanel(){
    var panel = byId('scenes-panel');
    var list = [['empty','Empty first conversation'],['long','Long multilingual conversation'],['proposal','Study-method proposal'],['correction','Correction and version'],['confirm','Exact-version confirmation'],['stale','Stale confirmation'],['ambiguous','Ambiguous assent'],['home','Returning Home'],['review','Review outcome'],['failure','Provider failure'],['feedback','Reply feedback']];
    panel.innerHTML = '<div class="drawer-head"><span class="mono label">SCENES \u00b7 SIMULATED</span><button id="close-scenes" class="btn btn--tiny" data-action="toggle-scenes">Close</button></div>'+
      '<p class="muted">Load a deterministic scene. Every scene is fictional and resets the in-page state.</p>'+
      '<div class="scene-list">'+list.map(function(it){ return '<button id="scene-'+it[0]+'" class="scene-btn'+(state.scenario===it[0]?' is-active':'')+'" data-action="scene" data-scene="'+it[0]+'">'+esc(it[1])+'</button>'; }).join('')+'</div>'+
      '<label class="check"><input type="checkbox" id="motion-toggle-2" data-action="toggle-motion" '+(state.reducedMotion?'checked':'')+'> Reduced motion</label>';
    panel.hidden = !state.scenesOpen;
  }

  function stateSummary(){
    return {
      scenario:state.scenario, screen:state.screen, profile:state.profile, simonState:state.simonState,
      selected:state.selected,
      decisions:state.decisions.map(function(d){ return {id:d.id, version:d.version, status:d.status, title:d.title}; }),
      proposals:state.proposals.map(function(p){ return {id:p.id, version:p.version, status:p.status, title:p.title}; }),
      checkins:state.checkins.map(function(c){ return {id:c.id, decisionId:c.decisionId, version:c.version, status:c.status}; }),
      feedback:state.feedback, failure:state.failure, rejectedConfirmation:state.rejected
    };
  }
  function renderStatePanel(){
    var panel = byId('state-panel');
    panel.innerHTML = '<div class="drawer-head"><span class="mono label">SIMULATED STATE</span><button id="close-state" class="btn btn--tiny" data-action="toggle-state">Close</button></div>'+
      '<p class="muted">In-memory only. Reloading discards it. No secrets and no personal data.</p>'+
      '<pre class="state-json">'+esc(JSON.stringify(stateSummary(), null, 2))+'</pre>';
    panel.hidden = !state.stateOpen;
  }

  function applyMotion(){ document.documentElement.classList.toggle('reduced-motion', state.reducedMotion); }

  function render(){
    var active = document.activeElement;
    var activeId = (active && active.id) ? active.id : null;
    var selStart = null;
    if(active && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; }
    renderTopbar(); renderRail(); renderWorkspace(); renderInspector(); renderComposer(); renderScenesPanel(); renderStatePanel(); applyMotion();
    if(activeId){
      var el = byId(activeId);
      if(el){
        el.focus();
        if(selStart !== null && typeof el.setSelectionRange === 'function'){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
      }
    }
  }

  function focusables(root){
    return Array.prototype.slice.call(root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(function(el){ return el.offsetParent !== null || el === document.activeElement; });
  }

  function onClick(e){
    var target = e.target.closest('[data-action]');
    if(!target){ return; }
    var action = target.getAttribute('data-action');
    if(action==='nav'){ state.screen = target.getAttribute('data-nav'); state.lastAction='Navigated to '+state.screen+'.'; render(); return; }
    if(action==='toggle-scenes'){ state.scenesOpen = !state.scenesOpen; if(state.scenesOpen){ state.stateOpen=false; } render(); return; }
    if(action==='toggle-state'){ state.stateOpen = !state.stateOpen; if(state.stateOpen){ state.scenesOpen=false; } render(); return; }
    if(action==='toggle-motion'){ state.reducedMotion = !state.reducedMotion; state.lastAction='Reduced motion '+(state.reducedMotion?'on':'off')+'.'; render(); return; }
    if(action==='scene'){ loadScene(target.getAttribute('data-scene')); return; }
    if(action==='select'){ selectItem(target.getAttribute('data-select-type'), target.getAttribute('data-select-id')); return; }
    if(action==='close-inspector'){ closeInspector(); return; }
    if(action==='confirm'){ confirmProposal(target.getAttribute('data-proposal-id')); return; }
    if(action==='stale'){ attemptStale(target.getAttribute('data-proposal-id')); return; }
    if(action==='correct'){ correctProposal(target.getAttribute('data-proposal-id')); return; }
    if(action==='dismiss'){ dismissProposal(target.getAttribute('data-proposal-id')); return; }
    if(action==='retry'){ retryMessage(target.getAttribute('data-message-id')); return; }
    if(action==='correct-checkin'){ correctCheckin(target.getAttribute('data-checkin-id')); return; }
    if(action==='feedback-open'){ openFeedback(target.getAttribute('data-reply-id')); return; }
    if(action==='feedback-remove'){ removeFeedback(target.getAttribute('data-reply-id')); return; }
    if(action==='fb-cancel'){ state.feedbackForm=null; state.lastAction='Feedback cancelled; nothing saved.'; render(); return; }
    if(action==='fb-rate'){
      var f = state.feedbackForm;
      if(!f){ return; }
      f[target.getAttribute('data-field')] = target.getAttribute('data-value');
      var group = target.parentElement;
      Array.prototype.slice.call(group.querySelectorAll('button')).forEach(function(b){
        var on = b.getAttribute('data-value') === target.getAttribute('data-value');
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on?'true':'false');
      });
      state.lastAction = 'Feedback draft updated (not saved).';
      return;
    }
  }

  function onSubmit(e){
    var form = e.target;
    if(form.id==='fb-form'){
      e.preventDefault();
      saveFeedback();
      return;
    }
    if(form.id==='composer-form'){
      e.preventDefault();
      var input = byId('composer-input');
      if(input){ handleSend(input.value); input.value=''; }
      return;
    }
  }

  function onKeydown(e){
    if(e.key==='Escape'){
      if(state.inspectorOpen){ closeInspector(); return; }
      if(state.scenesOpen){ state.scenesOpen=false; render(); return; }
      if(state.stateOpen){ state.stateOpen=false; render(); return; }
    }
    if(e.key==='Tab' && state.inspectorOpen && isNarrow()){
      var panel = byId('inspector');
      if(!panel){ return; }
      var list = focusables(panel);
      if(!list.length){ return; }
      var first = list[0], last = list[list.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  }

  function onResize(){
    if(!isNarrow() && state.inspectorOpen){ state.inspectorOpen=false; render(); }
  }

  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKeydown);
  window.addEventListener('resize', onResize);
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if(mq && mq.matches){ state.reducedMotion = true; }

  loadScene('empty');
})();
</script>
</body>
</html>
