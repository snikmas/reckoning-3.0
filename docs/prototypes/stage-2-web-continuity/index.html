<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage 2 web continuity prototype | Reckoning</title>
  <style>
    :root {
      color-scheme: dark;
      /* system-panel-v2 palette */
      --bg: #0a0f0c;
      --bg-elevated: #0f1512;
      --panel: #111a16;
      --panel-2: #141f1b;
      --panel-3: #18241f;
      --border: #1f2d27;
      --border-strong: #2a3d35;
      --text: #e6f0ea;
      --text-secondary: #9db3a8;
      --muted: #7d8f86;
      --green: #3ddc84;
      --green-dim: #2b9e5e;
      --green-bg: rgba(61, 220, 132, 0.08);
      --amber: #e0a04a;
      --amber-dim: #9e6f2b;
      --amber-bg: rgba(224, 160, 74, 0.08);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.08);
      --focus: #3ddc84;
      --accent: #3ddc84;
      --nav-width: 12rem;
      --inspector-width: 22rem;
      --header-height: 3rem;
      --composer-height: 3.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-areas:
        "notice notice notice"
        "header header header"
        "nav main inspector";
      grid-template-columns: var(--nav-width) minmax(0, 1fr) var(--inspector-width);
      grid-template-rows: auto var(--header-height) 1fr;
      min-height: 100vh;
    }

    /* Typography primitives */
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .page-title {
      font-size: 0.92rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0;
    }
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin: 0.25rem 0 0;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 1.5rem 0 0.75rem;
    }

    /* Notice */
    .notice {
      grid-area: notice;
      background: var(--amber-bg);
      border-bottom: 1px solid rgba(224, 160, 74, 0.25);
      padding: 0.45rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
    }
    .notice__badge {
      background: rgba(224, 160, 74, 0.18);
      color: var(--amber);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.5rem;
      text-transform: uppercase;
      white-space: nowrap;
      border: 1px solid rgba(224, 160, 74, 0.3);
    }
    .notice__text { color: var(--text-secondary); }
    .notice__text strong { color: var(--text); }

    /* Scenes menu */
    .scenes { margin-left: auto; position: relative; }
    .scenes summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      list-style: none;
      user-select: none;
      text-transform: uppercase;
    }
    .scenes summary::-webkit-details-marker { display: none; }
    .scenes[open] > summary { color: var(--text); }
    .scenes__panel {
      position: absolute;
      right: 0;
      top: 1.8rem;
      z-index: 100;
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
      min-width: 18rem;
      max-width: 90vw;
      max-height: 70vh;
      overflow: auto;
      padding: 0.5rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.55);
    }
    .scenes__panel button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 0.45rem 0.6rem;
      font: inherit;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .scenes__panel button:hover, .scenes__panel button:focus-visible {
      background: var(--panel-3);
      outline: none;
    }
    .scenes__panel small {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
    }
    .reduced-motion-toggle {
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .reduced-motion-toggle input { accent-color: var(--accent); }

    /* Header */
    .top-header {
      grid-area: header;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 1rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .top-header__left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      font-weight: 600;
    }
    .top-header__left svg {
      width: 1.1rem; height: 1.1rem;
      color: var(--green);
    }
    .top-header__left span { color: var(--muted); font-weight: 400; }
    .top-header__center { color: var(--muted); }
    .top-header__right {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
    }
    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      box-shadow: 0 0 0.35rem var(--green-dim);
      margin-right: 0.35rem;
    }

    /* Navigation */
    nav {
      grid-area: nav;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem 0.5rem;
      gap: 0.15rem;
      overflow: auto;
    }
    nav a {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-height: 44px;
      padding: 0.55rem 0.8rem;
      color: var(--muted);
      text-decoration: none;
      border-radius: 0.3rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      position: relative;
    }
    nav a:hover, nav a:focus-visible { background: var(--panel); color: var(--text); outline: none; }
    nav a[aria-current="page"] {
      background: var(--panel);
      color: var(--green);
    }
    nav a[aria-current="page"]::before {
      content: "";
      position: absolute;
      left: 0; top: 0.35rem; bottom: 0.35rem;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--green);
    }
    .nav__icon {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      color: currentColor;
    }

    /* Main */
    main {
      grid-area: main;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 1.5rem clamp(1rem, 3vw, 2.5rem);
    }
    .workspace:focus-visible { outline: none; }

    /* Cards */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 1rem;
      max-width: 100%;
    }
    .card__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .card__title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0;
      font-weight: 600;
    }
    .card__body { color: var(--text-secondary); }
    .card__body p { margin: 0 0 0.5rem; }
    .card__body p:last-child { margin-bottom: 0; }
    .card__actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    /* Status badges */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.55rem;
      border-radius: 0.2rem;
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
      white-space: nowrap;
      color: var(--text-secondary);
    }
    .status--proposed { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-bg); }
    .status--confirmed { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
    .status--stale { color: var(--red); border-color: rgba(239,68,68,0.5); background: var(--red-bg); }
    .status--failed { color: var(--red); border-color: rgba(239,68,68,0.5); background: var(--red-bg); }
    .status--limited { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-bg); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.45rem 0.8rem;
      border-radius: 0.3rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--panel-2); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn--primary {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-bg);
    }
    .btn--primary:hover { background: rgba(61, 220, 132, 0.14); }
    .btn--danger { color: var(--red); border-color: rgba(239,68,68,0.45); }
    .btn--ghost { background: transparent; }

    /* Simon hero */
    .simon-hero {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .simon-hero__avatar {
      width: 6.5rem;
      height: 6.5rem;
      flex: 0 0 auto;
      position: relative;
    }
    .simon-hero__avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(61, 220, 132, 0.15), transparent 60%);
    }
    .simon-hero__avatar::after {
      content: "";
      position: absolute;
      inset: -0.25rem;
      border-radius: 50%;
      border: 1px solid rgba(61, 220, 132, 0.25);
      pointer-events: none;
    }
    .simon-hero__status {
      flex: 1 1 auto;
      min-width: min(100%, 20rem);
    }
    .simon-hero__status h1 { margin-bottom: 0.25rem; }
    .status-table {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.75rem;
    }
    .status-table dt {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.68rem;
    }
    .status-table dd { margin: 0; }
    .simon-hero__note {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0.6rem 0 0;
      max-width: 42rem;
    }

    /* State flow / connected-state cards */
    .state-flow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 0.75rem;
      align-items: stretch;
      margin-bottom: 1.25rem;
      position: relative;
    }
    .state-flow__card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 1rem;
    }
    .state-flow__card:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: -0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      z-index: 2;
      background: var(--bg);
      width: 1.2rem;
      text-align: center;
    }
    .state-flow__title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 0.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .state-flow__body {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }
    .state-flow__body p { margin: 0 0 0.5rem; }
    .state-flow__body p:last-child { margin-bottom: 0; }
    .state-flow__body ul { margin: 0; padding-left: 1.1rem; }
    .state-flow__body li { margin-bottom: 0.35rem; }
    .state-flow__body strong { color: var(--text); }

    /* Exchanges / conversation thread */
    .exchanges {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .exchange {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .exchange:hover, .exchange:focus-visible { background: var(--panel-2); outline: none; }
    .exchange--selected { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    .exchange__avatar {
      width: 2.2rem;
      height: 2.2rem;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
    }
    .exchange__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .exchange__main { min-width: 0; }
    .exchange__header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.25rem;
    }
    .exchange__role {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .exchange__time { color: var(--muted); font-size: 0.74rem; }
    .exchange__content {
      min-width: 0;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .exchange__content p { margin: 0 0 0.4rem; }
    .exchange__content p:last-child { margin-bottom: 0; }
    .exchange__meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Empty state */
    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    /* Composer */
    .composer {
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      padding: 0.6rem clamp(1rem, 3vw, 2.5rem);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }
    .composer__prompt {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      user-select: none;
    }
    .composer input {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      font-size: 0.95rem;
      padding: 0.35rem 0;
    }
    .composer input::placeholder { color: var(--muted); }
    .composer input:focus-visible { outline: none; }
    .composer:focus-within { box-shadow: inset 0 0 0 1px var(--green); }
    .composer__hint {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      border: 1px solid var(--border-strong);
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
    }
    .composer button[type="submit"] {
      flex: 0 0 auto;
      width: 2.4rem;
      height: 2.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 0.3rem;
      cursor: pointer;
    }
    .composer button[type="submit"] svg { width: 1rem; height: 1rem; }
    .composer button[type="submit"]:hover { background: var(--green-bg); }
    .composer button[type="submit"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .command-hint {
      position: absolute;
      bottom: calc(100% + 0.5rem);
      left: clamp(1rem, 3vw, 2.5rem);
      right: clamp(1rem, 3vw, 2.5rem);
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
      border-radius: 0.35rem;
      padding: 0.6rem 0.9rem;
      font-size: 0.82rem;
      color: var(--muted);
      box-shadow: 0 -0.25rem 0.75rem rgba(0,0,0,0.45);
    }
    .command-hint code {
      color: var(--text);
      background: var(--bg);
      padding: 0.05rem 0.3rem;
      border-radius: 0.2rem;
    }

    /* Lists */
    .item-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .item-row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .item-row:hover, .item-row:focus-visible { background: var(--panel-2); outline: none; }
    .item-row__text { min-width: 0; }
    .item-row__title { font-weight: 600; display: block; color: var(--text); }
    .item-row__note { color: var(--muted); font-size: 0.8rem; }

    /* Inspector */
    .inspector-desktop {
      grid-area: inspector;
      background: var(--bg-elevated);
      border-left: 1px solid var(--border);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .inspector__header {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .inspector__header svg {
      width: 0.9rem; height: 0.9rem;
      color: var(--muted);
    }
    .inspector__body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 1rem 1.1rem;
    }
    .inspector__section { margin-bottom: 1.1rem; }
    .inspector__section h3 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 0.4rem;
      font-weight: 600;
    }
    .inspector__section p, .inspector__section li {
      color: var(--text-secondary);
      margin: 0 0 0.35rem;
      font-size: 0.9rem;
    }
    .inspector__section ul { padding-left: 1.1rem; margin: 0; }
    .inspector__section code {
      color: var(--text);
      background: var(--panel-2);
      padding: 0.1rem 0.3rem;
      border-radius: 0.2rem;
      font-size: 0.82rem;
    }
    .inspector__empty { color: var(--muted); font-size: 0.88rem; }
    .inspector__state {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 0.85rem 1.1rem;
      background: var(--panel);
      font-size: 0.74rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .inspector__state code {
      color: var(--text);
      background: var(--panel-2);
      padding: 0.05rem 0.25rem;
      border-radius: 0.2rem;
    }
    .inspector__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    #inspector-dialog {
      border: 0;
      background: var(--bg-elevated);
      color: var(--text);
      width: min(32rem, 92vw);
      max-height: 85vh;
      border-radius: 0.4rem;
      padding: 0;
      border: 1px solid var(--border-strong);
    }
    #inspector-dialog::backdrop { background: rgba(0,0,0,0.7); }
    #inspector-dialog .inspector__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inspector-dialog .inspector__body { max-height: 60vh; overflow: auto; }

    /* Failure banner */
    .failure-banner {
      background: var(--red-bg);
      border: 1px solid rgba(239,68,68,0.35);
      color: var(--red);
      padding: 0.75rem 1rem;
      border-radius: 0.35rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    /* Motion */
    @media (prefers-reduced-motion: no-preference) {
      .simon-hero__avatar img { animation: breathe 5s ease-in-out infinite; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.03); filter: brightness(1.06); }
    }
    body.reduce-motion .simon-hero__avatar img { animation: none; }
    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    /* Focus */
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Narrow layout */
    @media (max-width: 900px) {
      .app {
        grid-template-areas:
          "notice"
          "header"
          "nav"
          "main";
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto 1fr;
      }
      .top-header { font-size: 0.62rem; }
      .top-header__center { display: none; }
      nav {
        flex-direction: row;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 0.5rem;
        gap: 0.15rem;
      }
      nav a { flex: 0 0 auto; min-height: 44px; white-space: nowrap; }
      nav a span { display: none; }
      .inspector-desktop { display: none; }
      .state-flow__card:not(:last-child)::after { display: none; }
      .composer { position: relative; }
      .simon-hero__avatar { width: 5rem; height: 5rem; }
      .exchange__meta { align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .exchange {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "avatar header"
          "avatar content"
          ". meta";
      }
      .exchange__avatar { grid-area: avatar; }
      .exchange__main { grid-area: content; }
      .exchange__header { grid-area: header; }
      .exchange__meta {
        grid-area: meta;
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="notice" role="banner">
      <span class="notice__badge" aria-hidden="true">Prototype</span>
      <span class="notice__text">
        <strong>Simulated only.</strong> No model is called, no data is saved, and every person and decision is fictional. Reloading resets everything.
      </span>
      <details class="scenes" id="scenes-menu">
        <summary aria-haspopup="true">Scenes</summary>
        <div class="scenes__panel" role="menu">
          <button role="menuitem" data-scene="empty">Empty first conversation</button>
          <button role="menuitem" data-scene="long">Long multilingual conversation</button>
          <button role="menuitem" data-scene="proposal">Study-method proposal</button>
          <button role="menuitem" data-scene="correction">Correction creates a new version</button>
          <button role="menuitem" data-scene="confirmed">Exact-version confirmation</button>
          <button role="menuitem" data-scene="stale">Stale confirmation rejected</button>
          <button role="menuitem" data-scene="ambiguous">Ambiguous “yes” asks for clarification</button>
          <button role="menuitem" data-scene="home">Returning Home</button>
          <button role="menuitem" data-scene="review">Review outcome and correction</button>
          <button role="menuitem" data-scene="failure">Provider failure with retry</button>
          <button role="menuitem" data-scene="feedback">Reply feedback via command</button>
          <div class="reduced-motion-toggle">
            <label><input type="checkbox" id="reduce-motion"> Reduce motion</label>
          </div>
        </div>
      </details>
    </header>

    <header class="top-header" aria-label="System status">
      <div class="top-header__left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
        <strong>Reckoning</strong> <span>/ Personal system</span>
      </div>
      <div class="top-header__center">Local · Private</div>
      <div class="top-header__right">
        <span><span class="status-dot" aria-hidden="true"></span>Simon: Ready</span>
        <span id="clock">--:--</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:1rem;height:1rem"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </header>

    <nav aria-label="Task areas">
      <a href="#" data-area="home" aria-current="false">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#" data-area="simon" aria-current="false">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="14.83" y1="9.17" x2="18.36" y2="5.64"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg>
        <span>Simon</span>
      </a>
      <a href="#" data-area="plan" aria-current="false">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>Plan</span>
      </a>
      <a href="#" data-area="review" aria-current="false">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Review</span>
      </a>
      <a href="#" data-area="control" aria-current="false">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Control</span>
      </a>
    </nav>

    <main id="main" tabindex="-1">
      <div class="workspace" id="workspace" aria-live="polite" aria-atomic="false"></div>
      <form class="composer" id="composer" autocomplete="off">
        <span class="composer__prompt" aria-hidden="true">>_</span>
        <label class="visually-hidden" for="composer-input">Command or message</label>
        <input id="composer-input" type="text" placeholder="Record something, ask Simon, or resume a decision…" required>
        <span class="composer__hint" aria-hidden="true">⌘K</span>
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </main>

    <aside class="inspector-desktop" aria-label="Inspector">
      <div class="inspector__header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="label">Inspector</span>
      </div>
      <div class="inspector__body" id="inspector-desktop-body"></div>
      <div class="inspector__state" id="inspector-desktop-state"></div>
    </aside>
  </div>

  <dialog id="inspector-dialog" aria-label="Inspector">
    <div class="inspector__header">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="label">Inspector</span>
      </div>
      <button class="btn btn--ghost" id="inspector-dialog-close">Close</button>
    </div>
    <div class="inspector__body" id="inspector-dialog-body"></div>
    <div class="inspector__state" id="inspector-dialog-state"></div>
  </dialog>

  <script>
    function simonAvatar() {
      return `<img src="assets/simon-orb.png" alt="" width="104" height="104" loading="eager">`;
    }
    function userAvatar() {
      return `<img src="assets/user-avatar.png" alt="" width="35" height="35" loading="lazy">`;
    }

    const ICONS = {
      proposed: "◐",
      confirmed: "●",
      stale: "○",
      failed: "⚡",
      limited: "◐",
      inspect: "🔍",
      feedback: "✎",
      confirmedInfo: "🗀",
      interpretation: "◉",
      challenge: "▲",
      question: "?",
    };

    const AMBIGUOUS_ASSENT = new Set(["yes", "y", "ok", "okay", "sure", "yep", "да", "дa", "好", "是的", "oui", "ja", "si"]);

    let state = freshState();

    function freshState() {
      return {
        area: "simon",
        returning: false,
        messages: [],
        decisions: [],
        proposals: [],
        checkIns: [],
        failure: null,
        selected: null,
        feedback: {},
        scene: "empty",
        runId: "sim-proto-" + Math.random().toString(36).slice(2, 10),
      };
    }

    function nextId(prefix) {
      return prefix + "-" + Math.random().toString(36).slice(2, 9);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function statusBadge(status) {
      const icon = ICONS[status] || "●";
      const labels = {
        proposed: "Proposed",
        confirmed: "Confirmed",
        stale: "Stale",
        failed: "Failed",
        limited: "Limited",
      };
      const label = labels[status] || status;
      return `<span class="status status--${status}" aria-label="${label}"><span aria-hidden="true">${icon}</span> ${label}</span>`;
    }

    const FIXTURES = {
      empty: () => ({
        area: "simon",
        returning: false,
        messages: [],
        decisions: [],
        proposals: [],
        checkIns: [],
        failure: null,
        selected: null,
      }),

      long: () => ({
        area: "simon",
        returning: false,
        messages: [
          msg("user", "I have been trying to prepare for the IELTS exam while keeping up with my software engineering coursework and a part-time project. Every time I sit down to study, I feel like I am stealing time from something else. I end up switching tasks every twenty minutes and retaining almost nothing. I am not sure whether the problem is the schedule, the study method, or just fatigue.", "en"),
          msg("assistant", "That sounds like a conflict between three real commitments, not a discipline problem. Before I propose anything, I want to know: which of the three has the nearest irreversible consequence?", "en"),
          msg("user", "Кажется, что я постоянно выбираю между подготовкой к экзамену и проектом, и ни одно из занятий не получает достаточного внимания. Когда я занимаюсь английским, думаю о дедлайне проекта, а когда работаю над проектом, чувствую вину за экзамен. Мне нужен способ, который позволит хотя бы одно из этих дел двигаться уверенно, не разрушая другое полностью. Я готова скорректировать расписание, но не хочу обещать того, что не выдержит даже недели.", "ru"),
          msg("assistant", "Понял. Конфликт не в том, что вы ленитесь, а в том, что обе задачи требуют одного и того же времени срочно. Скажите, пожалуйста, дата экзамена уже фиксирована или ещё можно сдвинуть регистрацию?", "ru"),
          msg("user", "我现在的问题是时间不够：每天上课、写作业、准备语言考试，还有一个项目要赶进度。我不想放弃任何一个，但这样下去每个都做不好。我最担心的是考试日期已经确定，而项目 deadline 又迫在眉睫。能不能先帮我找一个 smallest proof：先做一周实验，看看哪种安排真的可行，而不是再列一个完美计划？", "zh"),
          msg("assistant", "这是一个很好的方向。我们可以把下周当作一个 bounded experiment：保护考试复习的最低必要时间，保留项目的一个小块进度，然后观察哪个安排真正可行，而不是假设你能立刻做到一切。", "zh"),
          msg("user", "I told my project partner 我需要减少这周的工作量 because the exam is earlier than expected, but then I felt guilty about 进度. At the same time, 如果我完全不管项目，一周后我会更焦虑。Can we find a third option that is honest about both constraints?", "und"),
          msg("assistant", "Yes. The third option is usually smaller than either all-in choice: a protected minimum for each commitment, with one clear experiment to test whether the balance is realistic.", "en"),
        ],
        decisions: [],
        proposals: [],
        checkIns: [],
        failure: null,
        selected: null,
      }),

      proposal: () => {
        const p = proposalFixture();
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I need a study method for the next two weeks. I keep re-reading the same pages and then forgetting them under pressure.", "en"),
            assistantProposal(p),
          ],
          decisions: [],
          proposals: [p],
          checkIns: [],
          failure: null,
          selected: { type: "proposal", id: p.id },
        };
      },

      correction: () => {
        const p = proposalFixture();
        p.version = 2;
        p.title = "Use short focused Pomodoro blocks with one daily review and a single 90-minute deep-reading block on weekends";
        p.changeNote = "Added a weekend deep-reading block after Mary said long sessions are possible on Saturdays.";
        p.reasons.push("The weekend block preserves the benefit of longer immersion without crowding weekdays.");
        p.tradeoffs.push("Saturday morning must be protected; if it conflicts, drop the block rather than the daily practice.");
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I need a study method for the next two weeks. I keep re-reading the same pages and then forgetting them under pressure.", "en"),
            assistantProposal(proposalFixture()),
            msg("user", "That is close, but I can actually do one longer session on Saturday mornings. Could we keep the short blocks on weekdays and add a deep-reading block on the weekend?", "en"),
            assistantProposal(p, "v2"),
          ],
          decisions: [],
          proposals: [p],
          checkIns: [],
          failure: null,
          selected: { type: "proposal", id: p.id },
        };
      },

      confirmed: () => {
        const p = proposalFixture();
        p.status = "confirmed";
        p.version = 3;
        p.confirmedAt = nowIso();
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I need a study method for the next two weeks. I keep re-reading the same pages and then forgetting them under pressure.", "en"),
            assistantProposal(proposalFixture()),
            msg("user", "That is close, but I can actually do one longer session on Saturday mornings. Could we keep the short blocks on weekdays and add a deep-reading block on the weekend?", "en"),
            assistantProposal(proposalFixture("v2"), "v2"),
            msg("user", "Confirm version 2.", "en"),
            msg("assistant", "Confirmed. The decision is saved as version 3.", "en"),
          ],
          decisions: [p],
          proposals: [],
          checkIns: [],
          failure: null,
          selected: { type: "decision", id: p.id },
        };
      },

      stale: () => {
        const original = proposalFixture();
        const corrected = proposalFixture("v2");
        corrected.version = 2;
        corrected.title = "Use short focused Pomodoro blocks with one daily review and a single 90-minute deep-reading block on weekends";
        corrected.changeNote = "Added a weekend deep-reading block.";
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I need a study method for the next two weeks.", "en"),
            assistantProposal(original),
            msg("user", "Add a weekend deep-reading block.", "en"),
            assistantProposal(corrected, "v2"),
            msg("user", "Confirm version 1.", "en"),
            msg("assistant", "That confirmation does not match the current proposal. The current version is 2. I cannot confirm a stale version.", "en"),
          ],
          decisions: [],
          proposals: [corrected],
          checkIns: [],
          failure: null,
          selected: { type: "proposal", id: corrected.id },
        };
      },

      ambiguous: () => {
        const p = proposalFixture();
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I need a study method for the next two weeks.", "en"),
            assistantProposal(p),
            msg("user", "yes", "en"),
            msg("assistant", "There are two possible readings of “yes.” Do you want to confirm the current proposal, correct it, or leave it for later?", "en"),
          ],
          decisions: [],
          proposals: [p],
          checkIns: [],
          failure: null,
          selected: { type: "proposal", id: p.id },
        };
      },

      home: () => {
        const confirmed = proposalFixture();
        confirmed.status = "confirmed";
        confirmed.version = 3;
        confirmed.confirmedAt = nowIso();
        const unfinished = proposalFixture("unfinished");
        unfinished.title = "Explore group study for the project course";
        unfinished.reasons = ["Mary mentioned a study group but is unsure about schedule fit."];
        unfinished.uncertainty = "Whether the group pace matches Mary's current gaps.";
        return {
          area: "home",
          returning: true,
          messages: [],
          decisions: [confirmed],
          proposals: [unfinished],
          checkIns: [],
          failure: null,
          selected: null,
        };
      },

      review: () => {
        const d = proposalFixture();
        d.status = "confirmed";
        d.version = 3;
        d.confirmedAt = nowIso();
        const checkIn = {
          id: nextId("checkin"),
          decisionId: d.id,
          occurredAt: nowIso(),
          outcome: "Completed four exam blocks and one project block; the practice-test score rose.",
          correctedOutcome: "Completed three exam blocks and one project block; the practice-test score rose slightly.",
        };
        return {
          area: "review",
          returning: true,
          messages: [],
          decisions: [d],
          proposals: [],
          checkIns: [checkIn],
          failure: null,
          selected: { type: "decision", id: d.id },
        };
      },

      failure: () => ({
        area: "simon",
        returning: false,
        messages: [
          msg("user", "What should I focus on today?", "en"),
        ],
        decisions: [],
        proposals: [],
        checkIns: [],
        failure: {
          provider: "fake",
          model: "deterministic-fake",
          message: "The fake provider run failed. Simulated network timeout before a reply could be prepared.",
          canRetry: true,
        },
        selected: null,
      }),

      feedback: () => {
        const reply = msg("assistant", "That sounds like a conflict between three real commitments, not a discipline problem. Before I propose anything, I want to know: which of the three has the nearest irreversible consequence?", "en");
        const fb = { useful: "partly", natural: "yes", comment: "The question is useful, but it appeared after a very long message and felt abrupt." };
        return {
          area: "simon",
          returning: false,
          messages: [
            msg("user", "I have been trying to prepare for the IELTS exam while keeping up with coursework and a part-time project...", "en"),
            reply,
          ],
          decisions: [],
          proposals: [],
          checkIns: [],
          failure: null,
          selected: { type: "message", id: reply.id },
          feedback: { [reply.id]: fb },
        };
      },
    };

    function msg(role, content, lang) {
      return { id: nextId("msg"), role, content, lang, createdAt: nowIso() };
    }

    function proposalFixture(tag) {
      const id = nextId("prop");
      const suffix = tag ? " " + tag : "";
      return {
        id,
        tag,
        title: "Use short focused Pomodoro blocks with one daily review instead of long passive reading" + suffix,
        version: 1,
        status: "proposed",
        situation: "Mary needs to retain IELTS material while protecting project time over the next two weeks.",
        reasons: [
          "Mary said she forgets material after re-reading for long stretches.",
          "Short blocks fit between fixed coursework and project meetings.",
        ],
        tradeoffs: [
          "Total study time may look smaller, but active recall can compensate.",
          "The plan fails if the daily review is skipped.",
        ],
        uncertainty: "Whether 25-minute blocks are enough for dense reading sections.",
        nextStep: "Try the schedule for one week and report what helped.",
        evidence: [
          { id: nextId("ev"), source: "Mary's message", content: "I keep re-reading the same pages and then forgetting them under pressure." },
          { id: nextId("ev"), source: "Inferred constraint", content: "Coursework and project meetings are fixed around study time." },
        ],
        changeNote: null,
        confirmedAt: null,
      };
    }

    function assistantProposal(p, note) {
      const content = `Proposed decision: ${p.title}.\n\nSituation: ${p.situation}\nReasons: ${p.reasons.join(" ")}\nTrade-offs: ${p.tradeoffs.join(" ")}\nUncertainty: ${p.uncertainty}\nNext step: ${p.nextStep}`;
      return {
        id: nextId("msg"),
        role: "assistant",
        content,
        lang: "en",
        createdAt: nowIso(),
        proposalId: p.id,
        proposalVersion: p.version,
        note,
      };
    }

    loadScene("empty");
    const urlScene = new URLSearchParams(window.location.search).get("scene");
    if (urlScene && FIXTURES[urlScene]) loadScene(urlScene);
    const urlZoom = new URLSearchParams(window.location.search).get("zoom");
    if (urlZoom) document.body.style.zoom = urlZoom;
    updateClock();
    setInterval(updateClock, 60000);

    function updateClock() {
      const el = document.getElementById("clock");
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function loadScene(name) {
      const base = freshState();
      const fixture = FIXTURES[name] ? FIXTURES[name]() : FIXTURES.empty();
      state = { ...base, ...fixture, scene: name };
      render();
      document.getElementById("scenes-menu").open = false;
    }

    function render() {
      renderNav();
      renderWorkspace();
      renderInspector();
      renderState();
    }

    function renderNav() {
      document.querySelectorAll("nav a").forEach((a) => {
        const area = a.dataset.area;
        const current = area === state.area;
        a.setAttribute("aria-current", current ? "page" : "false");
      });
    }

    function renderWorkspace() {
      const w = document.getElementById("workspace");
      const composer = document.getElementById("composer");
      w.innerHTML = "";
      if (state.area === "simon") {
        renderSimon(w);
        composer.style.display = "flex";
      } else if (state.area === "home") {
        renderHome(w);
        composer.style.display = "none";
      } else if (state.area === "review") {
        renderReview(w);
        composer.style.display = "none";
      } else if (state.area === "plan") {
        renderPlan(w);
        composer.style.display = "none";
      } else if (state.area === "control") {
        renderControl(w);
        composer.style.display = "none";
      }
    }

    function renderSimon(container) {
      if (state.failure) {
        container.innerHTML += `<div class="failure-banner" role="alert">
          <span aria-hidden="true">${ICONS.failed}</span>
          <span>${escapeHtml(state.failure.message)}</span>
          ${state.failure.canRetry ? `<button class="btn" id="retry-btn">Retry</button>` : ""}
        </div>`;
        setTimeout(() => {
          const retry = document.getElementById("retry-btn");
          if (retry) retry.addEventListener("click", retryFailure);
        }, 0);
      }

      const active = state.proposals[0] || state.decisions[0] || null;
      const hero = document.createElement("div");
      hero.className = "simon-hero";
      hero.innerHTML = `
        <div class="simon-hero__avatar" aria-hidden="true">${simonAvatar()}</div>
        <div class="simon-hero__status">
          <h1 class="page-title">Simon</h1>
          <div class="page-subtitle">Your reasoning partner. Interpretation remains separate from confirmed memory.</div>
          <dl class="status-table">
            <dt>Status</dt><dd>${active ? statusBadge(active.status) : "Ready"}</dd>
            <dt>Role</dt><dd>Reasoning partner</dd>
            <dt>Mode</dt><dd>Direct</dd>
            <dt>Sensitivity</dt><dd>Balanced</dd>
          </dl>
          <p class="simon-hero__note">Sharp, composed, evidence-first. Challenges reasoning and choices, never personal worth.</p>
        </div>
      `;
      container.appendChild(hero);

      container.appendChild(buildStateFlow(active));

      const recent = document.createElement("div");
      recent.innerHTML = `<h2 class="section-title">Recent exchanges</h2>`;
      const exchangesDiv = document.createElement("div");
      exchangesDiv.className = "exchanges";
      if (state.messages.length === 0) {
        exchangesDiv.innerHTML = `<p class="empty-state">Send the first message, or open Scenes to load a prepared state.</p>`;
      } else {
        state.messages.forEach((m) => {
          exchangesDiv.appendChild(renderExchange(m));
        });
      }
      recent.appendChild(exchangesDiv);
      container.appendChild(recent);
    }

    function buildStateFlow(active) {
      const flow = document.createElement("div");
      flow.className = "state-flow";

      const confirmedCard = document.createElement("div");
      confirmedCard.className = "state-flow__card";
      confirmedCard.innerHTML = `
        <div class="state-flow__title"><span aria-hidden="true">${ICONS.confirmedInfo}</span> Confirmed information</div>
        <div class="state-flow__body">
          ${active
            ? `<p><strong>${escapeHtml(active.situation)}</strong></p>
               <ul>${active.evidence.map((e) => `<li><strong>${escapeHtml(e.source)}:</strong> ${escapeHtml(e.content)}</li>`).join("")}</ul>`
            : `<p class="empty-state">No confirmed information yet. Start by telling Simon the nearest irreversible consequence you are facing.</p>`}
        </div>
      `;

      const interpretationCard = document.createElement("div");
      interpretationCard.className = "state-flow__card";
      interpretationCard.innerHTML = `
        <div class="state-flow__title"><span aria-hidden="true">${ICONS.interpretation}</span> AI interpretation</div>
        <div class="state-flow__body">
          ${active
            ? `<p>${escapeHtml(active.title)}</p>
               ${active.changeNote ? `<p><strong>Change note:</strong> ${escapeHtml(active.changeNote)}</p>` : ""}`
            : `<p class="empty-state">Simon will propose an interpretation once enough information is confirmed.</p>`}
        </div>
      `;

      const challengeCard = document.createElement("div");
      challengeCard.className = "state-flow__card";
      challengeCard.innerHTML = `
        <div class="state-flow__title"><span aria-hidden="true">${ICONS.challenge}</span> Challenge</div>
        <div class="state-flow__body">
          ${active
            ? `<p>Are you optimizing for learning, or avoiding the discomfort of choosing one priority?</p>`
            : `<p class="empty-state">A challenge will appear once an interpretation is proposed.</p>`}
        </div>
      `;

      const nextCard = document.createElement("div");
      nextCard.className = "state-flow__card";
      nextCard.innerHTML = `
        <div class="state-flow__title"><span aria-hidden="true">${ICONS.question}</span> Next question</div>
        <div class="state-flow__body">
          ${active
            ? `<p>${escapeHtml(active.nextStep)}</p>
               <p style="color:var(--amber);font-size:.82rem"><strong>Uncertainty:</strong> ${escapeHtml(active.uncertainty)}</p>`
            : `<p class="empty-state">What is the nearest irreversible consequence?</p>`}
        </div>
      `;

      flow.appendChild(confirmedCard);
      flow.appendChild(interpretationCard);
      flow.appendChild(challengeCard);
      flow.appendChild(nextCard);
      return flow;
    }

    function renderExchange(m) {
      const article = document.createElement("article");
      article.className = "exchange" + (state.selected && state.selected.type === "message" && state.selected.id === m.id ? " exchange--selected" : "");
      article.tabIndex = 0;
      const roleLabel = m.role === "user" ? "You" : "Simon";
      const feedback = state.feedback[m.id];
      const feedbackTag = feedback
        ? `<span class="status" aria-label="Feedback recorded">${ICONS.feedback} Feedback recorded</span>`
        : "";
      const avatar = m.role === "user" ? userAvatar() : simonAvatar();
      article.innerHTML = `
        <div class="exchange__avatar" aria-hidden="true">${avatar}</div>
        <div class="exchange__main">
          <div class="exchange__header">
            <span class="exchange__role">${roleLabel}</span>
            <span class="exchange__time">${formatTime(m.createdAt)}</span>
          </div>
          <div class="exchange__content" lang="${m.lang || 'en'}">${formatContent(m.content)}</div>
        </div>
        <div class="exchange__meta">
          ${feedbackTag}
          <span class="status" aria-label="${m.lang || 'unknown'} language">${m.lang || "und"}</span>
        </div>
      `;
      article.addEventListener("click", () => selectItem({ type: "message", id: m.id }, article));
      article.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectItem({ type: "message", id: m.id }, article);
        }
      });
      return article;
    }

    function renderHome(container) {
      container.innerHTML = `<p class="label" style="margin:0 0 0.35rem">Command center</p><h1 class="page-title">Home</h1>`;
      const confirmed = state.decisions.filter((d) => d.status === "confirmed");
      const pending = state.proposals.filter((p) => p.status === "proposed");
      container.innerHTML += `<h2 class="section-title">Recent decisions</h2>`;
      if (confirmed.length === 0) container.innerHTML += `<p class="empty-state">No confirmed decisions yet.</p>`;
      else {
        const list = document.createElement("div");
        list.className = "item-list";
        confirmed.forEach((d) => list.appendChild(decisionRow(d)));
        container.appendChild(list);
      }
      container.innerHTML += `<h2 class="section-title">Unfinished proposals</h2>`;
      if (pending.length === 0) container.innerHTML += `<p class="empty-state">No unfinished proposals.</p>`;
      else {
        const list = document.createElement("div");
        list.className = "item-list";
        pending.forEach((p) => list.appendChild(proposalRow(p)));
        container.appendChild(list);
      }
      container.innerHTML += `<h2 class="section-title">System health</h2><p class="empty-state">Healthy · Fake provider · No network calls.</p>`;
    }

    function renderReview(container) {
      container.innerHTML = `<p class="label" style="margin:0 0 0.35rem">Learn from outcomes</p><h1 class="page-title">Review</h1>`;
      if (state.decisions.length === 0) {
        container.innerHTML += `<p class="empty-state">No decisions to review.</p>`;
        return;
      }
      const list = document.createElement("div");
      list.className = "item-list";
      state.decisions.forEach((d) => list.appendChild(decisionRow(d)));
      container.appendChild(list);
      const selected = getSelectedDecision();
      if (selected) {
        const related = state.checkIns.filter((c) => c.decisionId === selected.id);
        container.innerHTML += `<h2 class="section-title">Outcomes for selected decision</h2>`;
        if (related.length === 0) container.innerHTML += `<p class="empty-state">No outcomes recorded.</p>`;
        else {
          related.forEach((c) => {
            container.innerHTML += `<div class="card">
              <div class="card__header"><h3 class="card__title">${formatTime(c.occurredAt)}</h3>${statusBadge("confirmed")}</div>
              <div class="card__body">
                <p><strong>Reported:</strong> ${escapeHtml(c.outcome)}</p>
                ${c.correctedOutcome ? `<p><strong>Corrected:</strong> ${escapeHtml(c.correctedOutcome)}</p>` : ""}
              </div>
            </div>`;
          });
        }
      }
    }

    function renderPlan(container) {
      container.innerHTML = `<p class="label" style="margin:0 0 0.35rem">Choose the work</p><h1 class="page-title">Plan</h1>
        <p class="empty-state">Plan does not acquire invented content in Stage 2. Direction, goals, and commitments remain out of scope for this prototype.</p>`;
    }

    function renderControl(container) {
      container.innerHTML = `<p class="label" style="margin:0 0 0.35rem">Operational truth</p><h1 class="page-title">Control</h1>
        <div class="card">
          <div class="card__header"><h3 class="card__title">Current run</h3>${state.failure ? statusBadge("failed") : statusBadge("confirmed")}</div>
          <div class="card__body">
            <p><strong>Run ID:</strong> <code>${state.runId}</code></p>
            <p><strong>Provider:</strong> fake</p>
            <p><strong>Model:</strong> deterministic-fake</p>
            <p><strong>Route:</strong> in-process</p>
            <p><strong>Cost status:</strong> not-billable</p>
            <p><strong>Failure state:</strong> ${state.failure ? escapeHtml(state.failure.message) : "none"}</p>
          </div>
        </div>`;
    }

    function proposalRow(p) {
      const row = document.createElement("button");
      row.className = "item-row";
      row.innerHTML = `<span class="item-row__text">
        <span class="item-row__title">${escapeHtml(p.title)}</span>
        <span class="item-row__note">Version ${p.version} · ${p.reasons.length} reasons</span>
      </span>${statusBadge(p.status)}`;
      row.addEventListener("click", () => selectItem({ type: "proposal", id: p.id }, row));
      return row;
    }

    function decisionRow(d) {
      const row = document.createElement("button");
      row.className = "item-row";
      row.innerHTML = `<span class="item-row__text">
        <span class="item-row__title">${escapeHtml(d.title)}</span>
        <span class="item-row__note">Confirmed ${d.confirmedAt ? formatTime(d.confirmedAt) : ""} · ${d.reasons.length} reasons</span>
      </span>${statusBadge(d.status)}`;
      row.addEventListener("click", () => selectItem({ type: "decision", id: d.id }, row));
      return row;
    }

    function getSelectedProposal() {
      if (!state.selected) return null;
      if (state.selected.type === "proposal") return state.proposals.find((p) => p.id === state.selected.id) || null;
      if (state.selected.type === "decision") return state.decisions.find((d) => d.id === state.selected.id) || null;
      return null;
    }

    function getSelectedDecision() {
      if (state.selected && state.selected.type === "decision") return state.decisions.find((d) => d.id === state.selected.id) || null;
      return null;
    }

    function getSelectedMessage() {
      if (state.selected && state.selected.type === "message") return state.messages.find((m) => m.id === state.selected.id) || null;
      return null;
    }

    function renderInspector() {
      const desktopBody = document.getElementById("inspector-desktop-body");
      const dialogBody = document.getElementById("inspector-dialog-body");
      const html = buildInspectorHtml();
      desktopBody.innerHTML = html;
      dialogBody.innerHTML = html;
    }

    function buildInspectorHtml() {
      const sel = state.selected;
      if (!sel) {
        return `<p class="inspector__empty">Select a reply, proposal, decision, or check-in to inspect its evidence and state.</p>`;
      }
      if (sel.type === "message") {
        const m = getSelectedMessage();
        if (!m) return `<p class="inspector__empty">Selected message not found.</p>`;
        let html = `<div class="inspector__section"><h3>Reply identity</h3><p><code>${m.id}</code></p></div>`;
        html += `<div class="inspector__section"><h3>Channel</h3><p>web</p></div>`;
        html += `<div class="inspector__section"><h3>Language</h3><p>${m.lang || "en"}</p></div>`;
        if (m.proposalId) {
          html += `<div class="inspector__section"><h3>Linked proposal</h3><p><code>${m.proposalId}</code> · version ${m.proposalVersion}</p></div>`;
        }
        const fb = state.feedback[m.id];
        if (fb) {
          html += `<div class="inspector__section"><h3>Feedback</h3>
            <p>Useful: ${fb.useful || "unrated"}</p>
            <p>Natural: ${fb.natural || "unrated"}</p>
            ${fb.comment ? `<p>Comment: ${escapeHtml(fb.comment)}</p>` : ""}
          </div>`;
        } else {
          html += `<div class="inspector__section"><h3>Feedback</h3><p class="inspector__empty">No feedback yet. Type <code>/feedback useful=yes natural=partly comment=...</code> while this reply is selected.</p></div>`;
        }
        return html;
      }
      const item = getSelectedProposal();
      if (!item) return `<p class="inspector__empty">Selected item not found.</p>`;
      let html = `<div class="inspector__section"><h3>Record identity</h3><p><code>${item.id}</code></p></div>`;
      html += `<div class="inspector__section"><h3>Status</h3><p>${statusBadge(item.status)} version ${item.version}</p></div>`;
      if (item.confirmedAt) html += `<div class="inspector__section"><h3>Confirmed at</h3><p>${formatTime(item.confirmedAt)}</p></div>`;
      html += `<div class="inspector__section"><h3>Situation</h3><p>${escapeHtml(item.situation)}</p></div>`;
      html += `<div class="inspector__section"><h3>Reasons</h3><ul>${item.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul></div>`;
      html += `<div class="inspector__section"><h3>Trade-offs</h3><ul>${item.tradeoffs.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}</ul></div>`;
      html += `<div class="inspector__section"><h3>Uncertainty</h3><p>${escapeHtml(item.uncertainty)}</p></div>`;
      html += `<div class="inspector__section"><h3>Evidence</h3><ul>${item.evidence.map((e) => `<li><strong>${escapeHtml(e.source)}:</strong> ${escapeHtml(e.content)}</li>`).join("")}</ul></div>`;
      if (item.changeNote) html += `<div class="inspector__section"><h3>Change note</h3><p>${escapeHtml(item.changeNote)}</p></div>`;
      if (item.status === "proposed") {
        html += `<div class="inspector__section"><h3>Actions</h3>
          <div class="inspector__actions">
            <button class="btn btn--primary" id="inspector-confirm">Confirm current version</button>
            <button class="btn" id="inspector-correct">Correct</button>
            <button class="btn btn--danger" id="inspector-dismiss">Dismiss</button>
          </div>
        </div>`;
      }
      return html;
    }

    function renderState() {
      const selectedLabel = state.selected ? `${state.selected.type}:${state.selected.id}` : "none";
      const proposal = state.proposals[0] || state.decisions[0];
      const version = proposal ? proposal.version : "—";
      const failure = state.failure ? state.failure.message : "none";
      const feedbackCount = Object.keys(state.feedback).length;
      const html = `<div><strong>Simulated state</strong></div>
        <div>Run ID: <code>${state.runId}</code> · Scene: <code>${state.scene}</code></div>
        <div>Record: <code>${proposal ? proposal.id : "none"}</code> · Version: ${version}</div>
        <div>Selected: <code>${selectedLabel}</code> · Feedback entries: ${feedbackCount}</div>
        <div>Failure: ${escapeHtml(failure)}</div>`;
      document.getElementById("inspector-desktop-state").innerHTML = html;
      document.getElementById("inspector-dialog-state").innerHTML = html;
    }

    function selectItem(sel, opener) {
      state.selected = sel;
      renderInspector();
      renderState();
      if (state.area === "simon") renderWorkspace();
      if (window.matchMedia("(max-width: 900px)").matches && opener) {
        openInspectorDialog(opener);
      }
    }

    function openInspectorDialog(opener) {
      const dialog = document.getElementById("inspector-dialog");
      if (dialog.open) return;
      dialog.showModal();
      attachInspectorActions();
      dialog.addEventListener("close", () => {
        if (opener && opener.focus) opener.focus();
      }, { once: true });
    }

    function attachInspectorActions() {
      const confirmBtn = document.getElementById("inspector-confirm");
      const correctBtn = document.getElementById("inspector-correct");
      const dismissBtn = document.getElementById("inspector-dismiss");
      if (confirmBtn) confirmBtn.addEventListener("click", confirmCurrentProposal);
      if (correctBtn) correctBtn.addEventListener("click", correctCurrentProposal);
      if (dismissBtn) dismissBtn.addEventListener("click", dismissCurrentProposal);
    }

    document.getElementById("inspector-dialog-close").addEventListener("click", () => {
      document.getElementById("inspector-dialog").close();
    });

    function wireDesktopInspector() {
      const desktop = document.getElementById("inspector-desktop-body");
      desktop.querySelector("#inspector-confirm")?.addEventListener("click", confirmCurrentProposal);
      desktop.querySelector("#inspector-correct")?.addEventListener("click", correctCurrentProposal);
      desktop.querySelector("#inspector-dismiss")?.addEventListener("click", dismissCurrentProposal);
    }

    function confirmCurrentProposal() {
      const p = getSelectedProposal();
      if (!p || p.status !== "proposed") return;
      const confirmed = { ...p, status: "confirmed", version: p.version + 1, confirmedAt: nowIso() };
      state.proposals = state.proposals.filter((x) => x.id !== p.id);
      state.decisions.push(confirmed);
      state.messages.push(msg("assistant", `Confirmed. The decision is saved as version ${confirmed.version}.`, "en"));
      state.selected = { type: "decision", id: confirmed.id };
      render();
    }

    function correctCurrentProposal() {
      const p = getSelectedProposal();
      if (!p || p.status !== "proposed") return;
      const corrected = { ...p, version: p.version + 1, changeNote: "Corrected by Mary through the Inspector.", title: p.title + " (corrected)" };
      state.proposals = state.proposals.map((x) => x.id === p.id ? corrected : x);
      state.messages.push(msg("user", "Correct the proposal: keep the core idea but adjust the details.", "en"));
      state.messages.push(assistantProposal(corrected, "v" + corrected.version));
      state.selected = { type: "proposal", id: corrected.id };
      render();
    }

    function dismissCurrentProposal() {
      const p = getSelectedProposal();
      if (!p || p.status !== "proposed") return;
      state.proposals = state.proposals.filter((x) => x.id !== p.id);
      state.messages.push(msg("assistant", "Proposal dismissed. It will not be treated as pending.", "en"));
      state.selected = null;
      render();
    }

    function retryFailure() {
      if (!state.failure || !state.failure.canRetry) return;
      state.failure = null;
      state.messages.push(msg("assistant", "Retry succeeded. The new study plan is to protect the exam baseline first, then fit one project block around it.", "en"));
      render();
    }

    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("composer-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      if (text.startsWith("/")) {
        handleCommand(text);
        return;
      }

      state.messages.push(msg("user", text, detectLang(text)));
      if (state.failure && state.failure.canRetry) {
        state.messages.push(msg("assistant", "A previous reply is still failed. Use the retry control above before sending more.", "en"));
      } else if (isAmbiguousAssent(text)) {
        state.messages.push(msg("assistant", "I read that as agreement, but I need to know which version or action you mean. Do you want to confirm the current proposal, correct it, or leave it for later?", "en"));
      } else if (text.toLowerCase().includes("confirm")) {
        const p = state.proposals[0];
        if (p) {
          if (text.includes("version 1") && p.version > 1) {
            state.messages.push(msg("assistant", "That confirmation does not match the current proposal. The current version is " + p.version + ". I cannot confirm a stale version.", "en"));
          } else {
            confirmCurrentProposal();
            return;
          }
        } else {
          state.messages.push(msg("assistant", "There is no pending proposal to confirm.", "en"));
        }
      } else {
        state.messages.push(msg("assistant", "Understood. If you want a proposal, tell me more about the nearest irreversible consequence you are facing.", "en"));
      }
      render();
      scrollToBottom();
    });

    function handleCommand(text) {
      const parts = text.slice(1).split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1).join(" ");

      if (cmd === "help") {
        state.messages.push(msg("assistant", "Available commands:\n/feedback useful=yes|partly|no natural=yes|partly|no comment=...\n/help", "en"));
      } else if (cmd === "feedback") {
        const parsed = parseFeedbackArgs(args);
        const selectedMessage = getSelectedMessage();
        if (!selectedMessage) {
          state.messages.push(msg("assistant", "Select a reply first, then type /feedback useful=... natural=... comment=...", "en"));
        } else if (selectedMessage.role !== "assistant") {
          state.messages.push(msg("assistant", "Feedback can only be recorded on Simon's replies.", "en"));
        } else {
          state.feedback[selectedMessage.id] = {
            useful: parsed.useful || null,
            natural: parsed.natural || null,
            comment: parsed.comment || "",
          };
          state.messages.push(msg("assistant", `Feedback recorded for ${selectedMessage.id}. Useful: ${parsed.useful || "—"}, Natural: ${parsed.natural || "—"}.`, "en"));
        }
      } else {
        state.messages.push(msg("assistant", `Unknown command: /${cmd}. Type /help for available commands.`, "en"));
      }
      render();
      scrollToBottom();
    }

    function parseFeedbackArgs(args) {
      const result = { useful: null, natural: null, comment: "" };
      const usefulMatch = args.match(/useful=(yes|partly|no)/i);
      if (usefulMatch) result.useful = usefulMatch[1].toLowerCase();
      const naturalMatch = args.match(/natural=(yes|partly|no)/i);
      if (naturalMatch) result.natural = naturalMatch[1].toLowerCase();
      const commentMatch = args.match(/comment=(.+?)(?=\s+\w+=|$)/i);
      if (commentMatch) result.comment = commentMatch[1].trim();
      return result;
    }

    function isAmbiguousAssent(text) {
      const normalized = text.trim().toLowerCase().replace(/[.!?，。]+$/g, "");
      return AMBIGUOUS_ASSENT.has(normalized);
    }

    function detectLang(text) {
      if (/[\u4e00-\u9fff]/.test(text)) return "zh";
      if (/[\u0400-\u04ff]/.test(text)) return "ru";
      return "en";
    }

    function scrollToBottom() {
      const workspace = document.getElementById("workspace");
      workspace.scrollTop = workspace.scrollHeight;
    }

    document.querySelectorAll("nav a").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        state.area = a.dataset.area;
        render();
      });
    });

    document.querySelectorAll(".scenes__panel button[data-scene]").forEach((b) => {
      b.addEventListener("click", () => loadScene(b.dataset.scene));
    });

    document.getElementById("reduce-motion").addEventListener("change", (e) => {
      document.body.classList.toggle("reduce-motion", e.target.checked);
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[c]);
    }

    function formatContent(text) {
      return escapeHtml(text).split("\n\n").map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
    }

    function formatTime(iso) {
      try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
      catch { return iso; }
    }

    const originalRender = render;
    render = function () {
      originalRender();
      wireDesktopInspector();
    };

    console.log("Reckoning Stage 2 prototype: simulated, no model calls, no saved data.");
  </script>
</body>
</html>
